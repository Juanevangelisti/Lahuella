<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias por tu consulta — La Huella Cabañas</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<style>
  .thanks {
    min-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .thanks img { width: 64px; margin-bottom: 28px; }
  .thanks h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin-bottom: 16px; }
  .thanks p { color: var(--ink-soft); max-width: 44ch; margin: 0 0 30px; }
</style>
</head>
<body>
  <section class="thanks">
    <img src="img/logo.png" alt="La Huella Cabañas" style="filter:none;">
    <h1>¡Gracias por tu consulta!</h1>
    <p>Ya la recibimos. Te vamos a responder por mail a la brevedad para confirmarte disponibilidad y coordinar los detalles.</p>
    <a class="btn btn--primary" href="index.html">Volver al inicio</a>
  </section>
</body>
</html>
